# Opt in only after running the explicit migration command.
diet:
  retrieval:
    enabled: true
    strategy: ${DIET_RETRIEVAL_STRATEGY:STRUCTURED}
    index-worker-enabled: ${DIET_RETRIEVAL_INDEXWORKERENABLED:false}
    embedding:
      endpoint: ${DIET_RETRIEVAL_EMBEDDING_ENDPOINT:}
      model: ${DIET_RETRIEVAL_EMBEDDING_MODEL:}
      api-key: ${DIET_RETRIEVAL_EMBEDDING_APIKEY:}
      dimensions: ${DIET_RETRIEVAL_EMBEDDING_DIMENSIONS:0}
      query-prefix: ${DIET_RETRIEVAL_EMBEDDING_QUERYPREFIX:}
      document-prefix: ${DIET_RETRIEVAL_EMBEDDING_DOCUMENTPREFIX:}
    qdrant:
      endpoint: ${DIET_RETRIEVAL_QDRANT_ENDPOINT:http://127.0.0.1:6333}
      collection: ${DIET_RETRIEVAL_QDRANT_COLLECTION:diet_meals_unconfigured}
